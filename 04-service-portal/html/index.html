<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 클라우드 실습실</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #101827; color: #edf2fa;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 900px; margin: 100px auto; padding: 24px; }
    .label { color: #77baff; letter-spacing: 2px; font-size: 13px; }
    h1 { font-size: 36px; margin-bottom: 12px; }
    .intro { color: #b2bfd0; line-height: 1.7; }
    .cards {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 24px; margin-top: 40px;
    }
    .card {
      display: block; padding: 32px; border-radius: 20px;
      background: #1b273a; border: 1px solid #34435a;
      color: inherit; text-decoration: none;
      transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-5px); border-color: #77baff; }
    .card:focus-visible { outline: 3px solid #77baff; }
    .icon { font-size: 44px; }
    .card p { color: #b2bfd0; line-height: 1.7; }
    .open { display: inline-block; margin-top: 18px; color: #77baff; }
    footer { margin-top: 40px; color: #8495ac; font-size: 13px; }
    @media (max-width: 600px) {
      main { margin-top: 40px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="label">MY CLOUD LAB</div>
    <h1>나의 클라우드 실습실</h1>
    <p class="intro">사용할 서비스를 선택하세요.</p>

    <div class="cards">
      <a class="card" href="/jupyter/">
        <span class="icon" aria-hidden="true">📓</span>
        <h2>Jupyter Lab</h2>
        <p>Python 코드를 작성하고<br>노트북으로 실습하세요.</p>
        <span class="open">실습 시작하기 →</span>
      </a>

      <a class="card" id="chat-link" href="#">
        <span class="icon" aria-hidden="true">💬</span>
        <h2>AI 채팅 실습</h2>
        <p>Open WebUI에서 질문하고<br>FastAPI의 연습용 응답을 확인하세요.</p>
        <span class="open">채팅 열기 →</span>
      </a>
    </div>

    <footer>개인 학습용 서비스 · Jupyter는 토큰 인증 후 이용하세요.</footer>
  </main>
  <script>
    const chatUrl = new URL(window.location.href);
    chatUrl.port = "3000";
    chatUrl.pathname = "/";
    chatUrl.search = "";
    chatUrl.hash = "";
    document.getElementById("chat-link").href = chatUrl.href;
  </script>
</body>
</html>
