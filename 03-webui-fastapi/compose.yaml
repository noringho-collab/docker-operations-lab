services:
  api:
    build: ./backend
    image: lab-fastapi:0.2
    ports:
      - "127.0.0.1:18000:8000"

  webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URLS: "http://api:8000/v1"
      OPENAI_API_KEYS: "practice-key"
      ENABLE_OLLAMA_API: "false"
    volumes:
      - webui-data:/app/backend/data
    depends_on:
      - api

volumes:
  webui-data:
